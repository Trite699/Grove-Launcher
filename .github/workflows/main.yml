name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qtbase5-dev qt5-qmake qtchooser qtbase5-dev-tools \
            qtmultimedia5-dev libqt5svg5-dev \
            clang make pkg-config upx unzip \
            libarchive-dev libbz2-dev liblzma-dev liblz4-dev libzstd-dev \
            nettle-dev libexpat1-dev libxml2-dev

      - name: Print toolchain versions
        run: |
          qmake --version
          clang --version

      - name: Build
        run: |
          set -e
          qmake -spec linux-clang
          make -j$(nproc)

      - name: Package
        run: |
          BIN_PATH=$(find . -path "*/bin/launcher" -type f | grep -v "\.cpp" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::Could not find compiled launcher binary"
            exit 1
          fi
          echo "Found executable at: $BIN_PATH"

          upx -9 --force "$BIN_PATH"

          mkdir -p artifact_out
          mv "$BIN_PATH" artifact_out/GroveLauncher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroveLauncher-Linux(x86_64)
          path: artifact_out/

  windows-i686:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (MinGW32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-qt5
            mingw-w64-i686-libarchive
            mingw-w64-i686-bzip2
            mingw-w64-i686-xz
            mingw-w64-i686-lz4
            mingw-w64-i686-zstd
            mingw-w64-i686-nettle
            mingw-w64-i686-expat
            mingw-w64-i686-libxml2
            mingw-w64-i686-zlib
            make
            git
            upx

      - name: Apply last-minute patches
        run: |
          set -e
          # NOTE: these patches were written for the old MXE-based build.
          # Confirm they still apply / are still needed against this toolchain.
          git apply --check launcher/ci.patch && git apply launcher/ci.patch
          cd libs/QArchive
          git apply --check ../QArchive.patch && git apply ../QArchive.patch

      - name: Build
        run: |
          set -e
          qmake
          mingw32-make -j$(nproc) release

      - name: Package
        run: |
          set -e
          BIN_PATH=$(find . -path "*/bin/launcher.exe" -type f | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::Could not find compiled launcher.exe binary"
            exit 1
          fi

          mkdir -p artifact_out
          cp "$BIN_PATH" artifact_out/GroveLauncher.exe

          # Bundle required Qt DLLs since this is a dynamic build
          windeployqt --release artifact_out/GroveLauncher.exe

          # Compress just the exe; skip failure rather than kill the build
          upx -9 --force artifact_out/GroveLauncher.exe || echo "upx failed, shipping uncompressed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroveLauncher-Windows
          path: artifact_out/
