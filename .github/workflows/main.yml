name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qtbase5-dev qt5-qmake qtchooser qtbase5-dev-tools \
            qtmultimedia5-dev libqt5svg5-dev \
            clang make pkg-config upx unzip \
            libarchive-dev libbz2-dev liblzma-dev liblz4-dev libzstd-dev \
            nettle-dev libexpat1-dev libxml2-dev

      - name: Print toolchain versions
        run: |
          qmake --version
          clang --version

      - name: Build
        run: |
          qmake -spec linux-clang
          make -j$(nproc)

      - name: Package
        run: |
          # Find the compiled executable automatically (ignoring source files)
          BIN_PATH=$(find . -type f -name "GroveLauncher" | grep -v "\.cpp" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::Could not find compiled GroveLauncher binary"
            exit 1
          fi
          echo "Found executable at: $BIN_PATH"

          # Compress the executable
          upx -9 --force "$BIN_PATH"

          # Move to a staging directory for the artifact upload
          mkdir -p artifact_out
          mv "$BIN_PATH" artifact_out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroveLauncher-Linux(x86_64)
          path: artifact_out/

  windows-i686:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/attorneyonline/ao2-client/builder-windows-i686
    env:
      # NOTE: verify this matches the MXE triplet baked into the builder image
      TARGET_SPEC: i686-w64-mingw32.static
    steps:
      - name: Install dependencies
        # git must be installed BEFORE checkout, otherwise actions/checkout
        # falls back to a REST API zip download and misses the .git folder
        run: |
          apt-get update
          apt-get install --no-install-recommends -y upx git

      - name: Trust the checked-out workspace
        # Newer git refuses to operate on a repo owned by a different
        # user, which is the case by default inside this container.
        # Use '*' so recursive submodules are also trusted during checkout.
        run: git config --global --add safe.directory '*'

      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply last-minute patches
        run: |
          set -e
          apply_patch() {
            local dir="$1" patch="$2"
            if ! (cd "$dir" && git apply --check "$patch" 2>/dev/null); then
              echo "::error::Patch $patch does not apply cleanly in $dir (already applied, or upstream changed)"
              exit 1
            fi
            (cd "$dir" && git apply "$patch")
          }
          apply_patch launcher ci.patch
          apply_patch libs/QArchive ../QArchive.patch

      - name: Build
        run: |
          if [ -z "$TARGET_SPEC" ]; then
            echo "::error::TARGET_SPEC is not set"
            exit 1
          fi
          /opt/mxe/usr/${TARGET_SPEC}/qt5/bin/qmake
          make -j$(nproc) release

      - name: Package
        run: |
          # Find the compiled executable automatically
          BIN_PATH=$(find . -type f -name "GroveLauncher.exe" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::Could not find compiled GroveLauncher.exe binary"
            exit 1
          fi
          echo "Found executable at: $BIN_PATH"

          # Compress the executable
          upx -9 --force "$BIN_PATH"

          # Move to a staging directory for the artifact upload
          mkdir -p artifact_out
          mv "$BIN_PATH" artifact_out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroveLauncher-Windows
          path: artifact_out/
